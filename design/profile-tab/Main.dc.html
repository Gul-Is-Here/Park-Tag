<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #F4C21B; } a:hover { color: #F9D65C; }
    .heading { font-family: 'Space Grotesk', system-ui, sans-serif; }
    input {
      font-family: 'Manrope', system-ui, sans-serif;
      background: #1E1E1E;
      color: #F5F1E8;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      outline: none;
    }
  </style>
</helmet>

<div style="width:390px; min-height:844px; background:#161616; color:#F5F1E8; padding:20px 24px 40px 24px;">

  <div class="heading" style="font-size:24px; font-weight:700; color:#F5F1E8;">Profile</div>

  <!-- Identity card -->
  <div style="margin-top:22px; display:flex; align-items:center; gap:14px;">
    <div style="width:64px; height:64px; border-radius:32px; background:#2A2210; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <div class="heading" style="font-size:22px; font-weight:700; color:#F4C21B;">TR</div>
    </div>
    <div style="flex:1;">
      <div style="font-size:18px; font-weight:700; color:#F5F1E8;">Turab Raza</div>
      <div style="display:flex; align-items:center; gap:5px; margin-top:5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7FBF7F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <div style="font-size:12.5px; font-weight:700; color:#7FBF7F;">Verified Resident</div>
      </div>
    </div>
  </div>

  <!-- Editable fields -->
  <div style="margin-top:28px; display:flex; flex-direction:column; gap:18px;">

    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">FULL NAME</div>
      <input type="text" value="Turab Raza">
    </div>

    <!-- Phone — read only -->
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">PHONE NUMBER</div>
      <div style="background:#1E1E1E; border-radius:14px; padding:14px; display:flex; align-items:center; justify-content:space-between;">
        <div style="font-size:15px; font-weight:600; color:#8A8A85;">+92 300 1234567</div>
        <div style="display:flex; align-items:center; gap:5px; background:#182018; border:1px solid #2A3D2A; border-radius:8px; padding:4px 9px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#7FBF7F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <div style="font-size:11px; font-weight:700; color:#7FBF7F; letter-spacing:0.02em;">Verified</div>
        </div>
      </div>
      <div style="font-size:11.5px; font-weight:500; color:#5C5C58;">Can't be changed without re-verification</div>
    </div>

    <div style="display:flex; gap:14px;">
      <div style="flex:1; display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">HOUSE NUMBER</div>
        <input type="text" value="123-B">
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">BLOCK / SECTOR</div>
        <input type="text" value="Model Town">
      </div>
    </div>

  </div>

  <!-- Save -->
  <div style="height:52px; border-radius:14px; background:#F4C21B; display:flex; align-items:center; justify-content:center; margin-top:26px;">
    <div class="heading" style="font-size:15px; font-weight:600; color:#161616;">Save Changes</div>
  </div>

  <!-- Divider -->
  <div style="height:1px; background:#262622; margin:28px 0;"></div>

  <!-- Logout -->
  <div style="height:52px; border-radius:14px; border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center; gap:8px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    <div class="heading" style="font-size:15px; font-weight:600; color:#F5F1E8;">Log Out</div>
  </div>

  <!-- Delete account -->
  <div style="height:52px; border-radius:14px; border:1.5px solid #3A2323; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E5675E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    <div class="heading" style="font-size:15px; font-weight:600; color:#E5675E;">Delete Account</div>
  </div>

</div>
</x-dc>
</body>
</html>
