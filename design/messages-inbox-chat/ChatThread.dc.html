<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #F4C21B; } a:hover { color: #F9D65C; }
    .heading { font-family: 'Space Grotesk', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width:390px; min-height:844px; background:#161616; color:#F5F1E8; display:flex; flex-direction:column;">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:12px; padding:20px 24px 16px 24px; border-bottom:1px solid #262622;">
    <div style="width:40px; height:40px; border-radius:14px; background:#1E1E1E; border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </div>
    <div style="width:38px; height:38px; border-radius:19px; background:#2A2210; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F4C21B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
    </div>
    <div style="flex:1; min-width:0;">
      <div style="font-size:14.5px; font-weight:700; color:#F5F1E8;">Bilal Ahmed</div>
      <div style="display:flex; align-items:center; gap:5px; margin-top:2px;">
        <div style="width:8px; height:8px; border-radius:2px; background:#2B2B2B; border:1px solid #33332E;"></div>
        <div style="font-size:11.5px; font-weight:600; color:#8A8A85;">LEB-4470</div>
      </div>
    </div>
    <div style="width:36px; height:36px; border-radius:12px; background:#1E1E1E; border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </div>
    <div style="width:36px; height:36px; border-radius:12px; background:#1E1E1E; border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </div>
  </div>

  <!-- Resolved banner -->
  <div style="padding:14px 24px; border-bottom:1px solid #262622; display:flex; align-items:center; justify-content:space-between; gap:12px;">
    <div style="font-size:13px; font-weight:600; color:#C9C9C4; flex:1;">Has this issue been resolved?</div>
    <div style="display:flex; gap:8px;">
      <div style="display:flex; align-items:center; gap:5px; background:#182018; border:1px solid #2A3D2A; border-radius:10px; padding:7px 11px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7FBF7F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <div style="font-size:12px; font-weight:700; color:#7FBF7F;">Resolved</div>
      </div>
      <div style="display:flex; align-items:center; gap:5px; background:#1E1E1E; border:1px solid #33332E; border-radius:10px; padding:7px 11px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8A85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        <div style="font-size:12px; font-weight:700; color:#8A8A85;">Not yet</div>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div style="flex:1; padding:20px 24px; display:flex; flex-direction:column; gap:14px;">

    <!-- Preset message, incoming -->
    <div style="align-self:flex-start; max-width:78%; display:flex; flex-direction:column; gap:4px;">
      <div style="background:#1E1E1E; border:1.5px solid #33332E; border-radius:16px 16px 16px 4px; padding:10px 14px;">
        <div style="font-size:14px; font-weight:500; color:#F5F1E8; line-height:1.45;">Please move your car</div>
      </div>
      <div style="font-size:11px; font-weight:600; color:#5C5C58; padding-left:4px;">2:10 PM</div>
    </div>

    <!-- Outgoing reply -->
    <div style="align-self:flex-end; max-width:78%; display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
      <div style="background:#F4C21B; border-radius:16px 16px 4px 16px; padding:10px 14px;">
        <div style="font-size:14px; font-weight:600; color:#161616; line-height:1.45;">On my way, 2 mins!</div>
      </div>
      <div style="display:flex; align-items:center; gap:4px; padding-right:4px;">
        <div style="font-size:11px; font-weight:600; color:#5C5C58;">2:11 PM</div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#F4C21B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L7 17l-5-5"/><path d="M22 10l-7.5 7.5L13 16"/></svg>
      </div>
    </div>

    <!-- Voice note, incoming -->
    <div style="align-self:flex-start; max-width:78%; display:flex; flex-direction:column; gap:4px;">
      <div style="background:#1E1E1E; border:1.5px solid #33332E; border-radius:16px 16px 16px 4px; padding:12px 14px; display:flex; align-items:center; gap:10px;">
        <div style="width:30px; height:30px; border-radius:15px; background:#2A2210; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#F4C21B" stroke="none"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <svg width="110" height="22" viewBox="0 0 110 22">
          <rect x="0" y="8" width="3" height="6" rx="1.5" fill="#8A8A85"/>
          <rect x="7" y="4" width="3" height="14" rx="1.5" fill="#8A8A85"/>
          <rect x="14" y="9" width="3" height="4" rx="1.5" fill="#8A8A85"/>
          <rect x="21" y="2" width="3" height="18" rx="1.5" fill="#F4C21B"/>
          <rect x="28" y="6" width="3" height="10" rx="1.5" fill="#F4C21B"/>
          <rect x="35" y="0" width="3" height="22" rx="1.5" fill="#F4C21B"/>
          <rect x="42" y="7" width="3" height="8" rx="1.5" fill="#8A8A85"/>
          <rect x="49" y="3" width="3" height="16" rx="1.5" fill="#8A8A85"/>
          <rect x="56" y="9" width="3" height="4" rx="1.5" fill="#8A8A85"/>
          <rect x="63" y="5" width="3" height="12" rx="1.5" fill="#8A8A85"/>
          <rect x="70" y="1" width="3" height="20" rx="1.5" fill="#8A8A85"/>
          <rect x="77" y="8" width="3" height="6" rx="1.5" fill="#8A8A85"/>
          <rect x="84" y="4" width="3" height="14" rx="1.5" fill="#8A8A85"/>
          <rect x="91" y="9" width="3" height="4" rx="1.5" fill="#8A8A85"/>
          <rect x="98" y="6" width="3" height="10" rx="1.5" fill="#8A8A85"/>
        </svg>
        <div style="font-size:11.5px; font-weight:600; color:#8A8A85; flex-shrink:0;">0:14</div>
      </div>
      <div style="font-size:11px; font-weight:600; color:#5C5C58; padding-left:4px;">2:12 PM</div>
    </div>

    <!-- Photo, outgoing -->
    <div style="align-self:flex-end; max-width:66%; display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
      <div style="border-radius:16px 16px 4px 16px; overflow:hidden; border:1.5px solid #33332E;">
        <div style="width:100%; aspect-ratio:4/3; background:linear-gradient(160deg,#2A2A26,#1B1B18); display:flex; align-items:center; justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5C5C58" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.2"/><path d="M9 6l1.2-2h3.6L15 6"/></svg>
        </div>
      </div>
      <div style="font-size:11px; font-weight:600; color:#5C5C58; padding-right:4px;">2:13 PM</div>
    </div>

  </div>

  <!-- Input bar -->
  <div style="padding:14px 24px; border-top:1px solid #262622; display:flex; align-items:center; gap:10px;">
    <div style="width:38px; height:38px; border-radius:12px; background:#1E1E1E; border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F4C21B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </div>
    <div style="flex:1; height:38px; border-radius:12px; background:#1E1E1E; border:1.5px solid #33332E; display:flex; align-items:center; padding:0 14px;">
      <div style="font-size:13.5px; font-weight:500; color:#5C5C58;">Message Bilal...</div>
    </div>
    <div style="width:38px; height:38px; border-radius:12px; background:#F4C21B; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
