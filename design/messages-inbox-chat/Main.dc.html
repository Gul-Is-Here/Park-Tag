<x-dc>

    * { box-sizing: border-box; }

          <div style="font-size:11.5px; font-weight:600; color:#8A8A85;">LEA-2231</div>
        </div>

      <div style="width:9px; height:9px; border-radius:5px; background:#F4C21B; margin-top:5px; flex-shrink:0;"></div>

      </div>
      <div style="flex:1; min-width:0;">

          <div style="font-size:12px; font-weight:600; color:#5C5C58; flex-shrink:0;">1h ago</div>
        </div>
        <div style="display:inline-flex; align-items:center; gap:6px; margin-top:5px; background:#161616; border:1px solid #33332E; border-radius:8px; padding:3px 8px;">

      </div>
    </div>

  </div>
</div>
