<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #F4C21B; } a:hover { color: #F9D65C; }
    .heading { font-family: 'Space Grotesk', system-ui, sans-serif; }
    input, textarea {
      font-family: 'Manrope', system-ui, sans-serif;
      background: #1E1E1E;
      color: #F5F1E8;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      outline: none;
    }
    ::placeholder { color: #5C5C58; }
  </style>
</helmet>

<div style="width:390px; min-height:844px; background:#161616; color:#F5F1E8; padding:0 0 40px 0;">

  <!-- Header -->
  <div style="padding:20px 24px 0 24px;">
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:40px; height:40px; border-radius:14px; background:#1E1E1E; border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <div>
        <div class="heading" style="font-size:20px; font-weight:700; color:#F5F1E8;">Edit Vehicle</div>
        <div style="font-size:13px; font-weight:600; color:#F4C21B; margin-top:2px;">Update your vehicle's saved details</div>
      </div>
    </div>
  </div>

  <div style="padding:28px 24px 0 24px; display:flex; flex-direction:column; gap:18px;">

    <!-- Make / Model -->
    <div style="display:flex; gap:14px;">
      <div style="flex:1; display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">MAKE</div>
        <input type="text" value="Toyota">
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">MODEL</div>
        <input type="text" value="Corolla Altis">
      </div>
    </div>

    <!-- Plate -->
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">REGISTRATION NUMBER (PLATE)</div>
      <input type="text" value="LEA-2231" style="border:1.5px solid #F4C21B; font-weight:700; letter-spacing:0.03em;">
    </div>

    <!-- Color / Date -->
    <div style="display:flex; gap:14px;">
      <div style="flex:1; display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">COLOR</div>
        <input type="text" value="White">
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">DATE OF REGISTRATION</div>
        <input type="text" value="14 Mar 2022">
      </div>
    </div>

    <!-- Engine -->
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">ENGINE NUMBER</div>
      <input type="text" value="2ZR-4498231">
    </div>

    <!-- Chassis -->
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">CHASSIS NUMBER</div>
      <input type="text" value="MR053CE3204119876">
    </div>

    <!-- Address -->
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">REGISTERED ADDRESS &nbsp;<span style="color:#5C5C58; font-weight:500;">(optional)</span></div>
      <textarea rows="2" style="resize:none; line-height:1.4;">123-B, Model Town, Lahore</textarea>
    </div>

    <!-- Nickname -->
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">VEHICLE NICKNAME &nbsp;<span style="color:#5C5C58; font-weight:500;">(optional)</span></div>
      <input type="text" value="White Corolla">
    </div>

    <!-- Vehicle photos -->
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:6px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="font-size:12px; font-weight:600; color:#8A8A85; letter-spacing:0.04em;">VEHICLE PHOTOS</div>
        <div style="font-size:12px; font-weight:600; color:#F4C21B;">2 of 2 added</div>
      </div>
      <div style="display:flex; gap:12px;">
        <div style="flex:1; position:relative;">
          <div style="aspect-ratio:1; border-radius:14px; background:linear-gradient(160deg,#2A2A26,#1B1B18); border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5C5C58" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.2"/><path d="M9 6l1.2-2h3.6L15 6"/></svg>
            <div style="position:absolute; bottom:8px; left:8px; font-size:11px; font-weight:600; color:#8A8A85; background:rgba(22,22,22,0.7); padding:3px 8px; border-radius:8px;">Front view</div>
          </div>
          <div style="position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:11px; background:#161616; border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
        <div style="flex:1; position:relative;">
          <div style="aspect-ratio:1; border-radius:14px; background:linear-gradient(160deg,#26221A,#1B1814); border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5C5C58" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.2"/><path d="M9 6l1.2-2h3.6L15 6"/></svg>
            <div style="position:absolute; bottom:8px; left:8px; font-size:11px; font-weight:600; color:#8A8A85; background:rgba(22,22,22,0.7); padding:3px 8px; border-radius:8px;">Back view</div>
          </div>
          <div style="position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:11px; background:#161616; border:1.5px solid #33332E; display:flex; align-items:center; justify-content:center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Save Changes -->
    <div style="height:52px; border-radius:14px; background:#F4C21B; display:flex; align-items:center; justify-content:center; margin-top:8px;">
      <div class="heading" style="font-size:15px; font-weight:600; color:#161616;">Save Changes</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
